[tool.poetry]
name = "rapid-response-system"
version = "1.0.0"
description = "IoT-enabled crisis management backend for housing societies"
authors = ["Dev Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.7.0"
pydantic-settings = "^2.2.0"
motor = "^3.4.0"                  # async MongoDB driver
pymongo = "^4.7.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
argon2-cffi = "^25.1.0"
python-multipart = "^0.0.9"
httpx = "^0.27.0"
redis = {extras = ["hiredis"], version = "^5.0.4"}
tenacity = "^8.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.6"
pytest-cov = "^5.0.0"
ruff = "^0.4.4"
mypy = "^1.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
